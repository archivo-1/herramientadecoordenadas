<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertir GeoJSON a Sheets String</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #output {
            margin-top: 10px;
            background-color: #e2e2e2;
            padding: 15px;
            border-radius: 4px;
            font-family: "Courier New", Courier, monospace;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Convertir GeoJSON a Sheets String</h1>
        <p>Pegar geometría GeoJSON aquí:</p>
        <textarea id="inputGeoJSON" placeholder='Pegar geometría GeoJSON aquí. Ejemplo: {"type":"Point","coordinates":[1,2]} o {"type":"LineString","coordinates":[[1,2],[3,4]]}'></textarea>
        <button onclick="convertToSingleLine()">Convertir a una línea de texto</button>
        <p>Copiar este resultado en Google Sheets:</p>
        <textarea id="outputGeoJSON" readonly></textarea>
    </div>
    <script>
        function convertToSingleLine() {
            const input = document.getElementById('inputGeoJSON').value;
            const output = document.getElementById('outputGeoJSON');
            
            try {
                const geojson = JSON.parse(input);
                if (!geojson.geometry) {
                    output.value = input.replace(/\s+/g, '');
                } else {
                    const geometryString = JSON.stringify(geojson.geometry);
                    output.value = geometryString.replace(/\s+/g, '');
                }
            } catch (e) {
                output.value = 'GeoJSON inválido. Revisar instrucciones.';
            }
        }
    </script>
</body>
</html>
